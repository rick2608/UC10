<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<title>Cybernexus — A cidade que nunca pode falhar</title>
<style>
:root{--bg:#07061a;--ink:#e8f0ff;--neon:#39ff88;--vio:#7c3aed;--cy:#22d3ee;--warn:#ff3b5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07061a;--ink:#e8f0ff}}
:root[data-theme="dark"]{--bg:#07061a;--ink:#e8f0ff}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif}
header{text-align:center;padding:28px 16px 8px}
h1{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(30px,6vw,56px);letter-spacing:.04em;margin:0;color:var(--neon);text-shadow:0 0 18px #39ff8855}
header p{margin:6px 0 0;color:#a9b4ff}
.page{max-width:980px;margin:26px auto;padding:0 12px}
.pt{font-family:Impact,sans-serif;letter-spacing:.05em;color:var(--cy);margin:0 0 8px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:170px;gap:8px;background:#0d0b2b;padding:8px;border:2px solid var(--vio);border-radius:6px;box-shadow:0 0 24px #7c3aed44}
.p{position:relative;overflow:hidden;border:3px solid #000;background:#000;min-width:0}
.p svg{width:100%;height:100%;display:block}
.b{position:absolute;width:36%;height:30%;background:#fff;border:2.5px solid #000;border-radius:50%;filter:drop-shadow(2px 2px 0 #0008)}
.b::after{content:"";position:absolute;width:14px;height:14px;background:#fff;border:2.5px solid #000;border-top:0;border-left:0;bottom:-8px;transform:rotate(45deg)}
.b.l::after{left:22%}.b.r::after{right:22%}.b.d::after{left:44%}
.code{background:#0a0f1e;padding:8px 10px;overflow:auto;border-color:var(--neon)}
.code h4{margin:0 0 4px;color:var(--neon);font:700 12px "Courier New",monospace}
pre{margin:0;font:12px/1.4 "Courier New",Consolas,monospace;color:#d6f5ff;white-space:pre-wrap}
.ok{color:var(--neon)}
@media (max-width:640px){.grid{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.p{grid-column:span 2!important;grid-row:span 1!important}.p.code{grid-row:span 2!important}}
</style></head><body>

function scene(t){
 const [a,b]=SC[t],id='g'+(++gid);let s=`<svg viewBox='0 0 300 170' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='${id}' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='300' height='170' fill='url(#${id})'/>`;

['Página 5 — Preparando o ambiente',[P(3,1,'lab','byte:110:40:1.3',[[40,4,'d']]),P(3,1,'lab','',[],`<h4>etapas</h4><pre>1. Instalar o Python\n2. Instalar o VS Code + extensão Python\n3. Criar a pasta do projeto e abrir no editor\n4. Criar o ambiente virtual\n5. Ativar o ambiente virtual\n6. Instalar pytest\n7. Criar app.py e test_app.py\n8. Executar os testes</pre>`),P(3,1,'lab','',[],`<h4>criar o ambiente virtual</h4><pre>python -m venv .venv</pre><h4 style="margin-top:8px">ativar (PowerShell)</h4><pre>.venv\\Scripts\\Activate.ps1</pre>`),P(3,1,'lab','',[],`<h4>instalar pytest</h4><pre>python -m pip install pytest</pre><h4 style="margin-top:8px">executar os testes</h4><pre>python -m pytest -v</pre>`),P(6,1,'lab','byte:130:40:1.3',[[48,4,'l']])]],

document.getElementById('m').innerHTML=PG.map(([t,ps])=>`<section class='page'><h2 class='pt'>${t}</h2><div class='grid'>`+ps.map(p=>{
